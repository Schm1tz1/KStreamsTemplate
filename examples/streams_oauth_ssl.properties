# General Kafka and Streams
bootstrap.servers={{BROKER-Bootstrap}}
acks=all
replication.factor=3
num.standby.replicas=1
#num.stream.threads=3

# Exactly-once processing (transactional producer + fenced zombie instances)
processing.guarantee=exactly_once_v2

# SASL/OAUTHBEARER against an OIDC-compatible token endpoint (client_credentials grant)
security.protocol=SASL_SSL
sasl.mechanism=OAUTHBEARER
sasl.login.callback.handler.class=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginCallbackHandler
sasl.oauthbearer.token.endpoint.url={{OAUTH-Token-Endpoint-Url}}
sasl.jaas.config=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required \
   clientId="{{OAUTH-Client-Id}}" \
   clientSecret="{{OAUTH-Client-Secret}}" \
   scope="{{OAUTH-Scope}}";

# Trust the broker's self-signed certificate via a CA bundle in PEM format,
# without having to import it into a JKS/PKCS12 keystore first.
ssl.truststore.type=PEM
ssl.truststore.location={{PATH-TO-CA-CERT-PEM}}

# Pipeline
streamsApp.inputTopic=input-topic
streamsApp.outputTopic=output-topic
